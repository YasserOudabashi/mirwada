name: CI

# Validator dei dati + suite headless.
#
# Riattivata il 2026-10-25 (i minuti di Actions si sono azzerati il 1 ottobre):
# gira sui push a main e sulle pull request, salta i commit di sola
# documentazione. La suite si lancia con tools/run_tests.sh, che fallisce anche
# sugli errori di script nascosti (un test interrotto a meta' risulterebbe
# superato).

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "006_PRD/**"
      - "docs/**"
      - "arte/**"
      - "diario.py"
      - "progress.txt"
      - "img/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "006_PRD/**"
      - "docs/**"
      - "arte/**"
      - "diario.py"
      - "progress.txt"
      - "img/**"
  workflow_dispatch:

# Un push nuovo sullo stesso ref annulla la run precedente ancora in coda/corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valida-e-testa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validator dei dati
        run: python tools/validate_data.py

      - name: Cache del binario Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Scarica Godot ${{ env.GODOT_VERSION }} headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "${base}/${file}.zip"
          unzip -q godot.zip
          mv "${file}" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Godot sul PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$HOME/godot/godot" --version

      - name: Import delle risorse
        # L'import headless in 4.3 non sempre esce 0; il gate vero e' la suite.
        run: timeout 120 godot --headless --path . --import || true

      - name: Suite headless (con il controllo sugli errori di script)
        run: bash tools/run_tests.sh
