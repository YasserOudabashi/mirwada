<title>Officina di Mirwada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Officina: la pergamena del libro di Mirwada in chiaro, l'inchiostro #181425 di Endesga 32 in scuro.
   Barra in alto con le schede, sotto una scheda per volta; le figure del gioco a 2x, senza sfumare. */
:root {
  --bg: #eef0f4; --pannello: #ffffff; --fondo2: #e3e7ef; --linea: #c0cbdc; --testo: #262b44; --tenue: #5a6988;
  --accento: #be4a2f; --accento-t: #fff; --ok: #3e8948; --no: #e43b44; --attesa: #f77622; --scacco1: #dfe4ec; --scacco2: #c9d1de;
  --f-titolo: "Alegreya SC", Georgia, serif; --f-testo: "Inter", system-ui, sans-serif; --f-dati: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181425; --pannello: #262b44; --fondo2: #1f1d33; --linea: #3a4466; --testo: #e3e7ef; --tenue: #8b9bb4;
  --accento: #feae34; --accento-t: #181425; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #181425; --pannello: #262b44; --fondo2: #1f1d33; --linea: #3a4466; --testo: #e3e7ef; --tenue: #8b9bb4;
  --accento: #feae34; --accento-t: #181425; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--testo); font: 14px/1.45 var(--f-testo); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pannello) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--pannello); border-bottom: 1px solid var(--linea) }
.testata { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-block: 10px 4px }
.testata h1 { font: 700 22px/1.1 var(--f-titolo); margin: 0; letter-spacing: .02em }

nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 0 }

nav a:hover { color: var(--testo) }
nav a[aria-current="page"] { color: var(--testo); border-color: var(--accento) }
main { padding-block: 16px 64px; max-width: 1400px; margin: 0 auto }
h2 { font: 700 20px var(--f-titolo); margin: 0 0 4px; text-wrap: balance }
h3 { font: 600 13px var(--f-testo); text-transform: uppercase; letter-spacing: .06em; color: var(--tenue); margin: 20px 0 8px }
p.intro { color: var(--tenue); margin: 0 0 14px; max-width: 70ch }
.sezione { display: flex; flex-direction: column; gap: 6px }
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px }
.griglia.larga { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)) }
.scheda { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: pointer; text-align: left; color: inherit; font: inherit }
.scheda:hover { border-color: var(--tenue) }
.scheda:focus-visible, button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px }
.scheda .nome { font-weight: 600; overflow-wrap: anywhere }
.scheda .sotto { color: var(--tenue); font-size: 12px }
.vetrina { background-color: var(--scacco1); background-image: conic-gradient(var(--scacco2) 25%, transparent 0 50%, var(--scacco2) 0 75%, transparent 0); background-size: 16px 16px; border-radius: 4px; display: grid; place-items: center; min-height: 128px; overflow: hidden }
.vetrina.scuro { --scacco1: #181425; --scacco2: #262b44 }
.vetrina.chiaro { --scacco1: #f4f4f4; --scacco2: #dcdcdc }
canvas.px, img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: 100% }
img.foto { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; background: var(--fondo2); display: block }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--fondo2); color: var(--tenue); border: 1px solid var(--linea) }
.chip.ok { color: var(--ok); border-color: var(--ok) } .chip.no { color: var(--no); border-color: var(--no) } .chip.att { color: var(--attesa); border-color: var(--attesa) }
.giudizio { display: flex; gap: 4px; align-items: center }
.giudizio button { flex: 1; white-space: nowrap; border: 1px solid var(--linea); background: var(--fondo2); color: var(--testo); border-radius: 4px; padding: 3px 0; cursor: pointer; font: 600 12px var(--f-testo) }
.giudizio button[aria-pressed="true"].si { background: var(--ok); border-color: var(--ok); color: #fff }
.giudizio button[aria-pressed="true"].no { background: var(--no); border-color: var(--no); color: #fff }
.giudizio button:disabled { opacity: .45; cursor: default }
.strisce { position: relative } .strisce::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; border-radius: 6px 0 0 6px }
.st-ok::before { background: var(--ok) } .st-no::before { background: var(--no) }
.filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px }
.filtri input[type=search], .filtri select { font: inherit; padding: 5px 8px; border: 1px solid var(--linea); border-radius: 4px; background: var(--pannello); color: var(--testo); min-width: 0 }
.filtri input[type=search] { flex: 1 1 220px }
.seg { display: inline-flex; border: 1px solid var(--linea); border-radius: 4px; overflow: hidden }
.seg button { border: 0; background: var(--pannello); color: var(--tenue); padding: 5px 9px; cursor: pointer; font: 500 12px var(--f-testo) }
.seg button[aria-pressed="true"] { background: var(--testo); color: var(--pannello) }
.numeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px }
.numero { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px }
.numero b { display: block; font: 600 24px var(--f-dati); font-variant-numeric: tabular-nums }
.numero span { color: var(--tenue); font-size: 12px }
.lista { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; overflow: hidden }
.lista > div { padding: 8px 12px; border-top: 1px solid var(--linea); display: flex; gap: 10px; align-items: baseline; min-width: 0 }
.lista > div:first-child { border-top: 0 }
.lista .id { font: 600 12px var(--f-dati); color: var(--accento); white-space: nowrap }
.lista .tx { min-width: 0; overflow-wrap: anywhere; flex: 1 }
.lista .dx { color: var(--tenue); font: 12px var(--f-dati); white-space: nowrap }
.due { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }
@media (max-width: 860px) { .due { grid-template-columns: 1fr } }
.barra { height: 8px; background: var(--fondo2); border-radius: 4px; overflow: hidden } .barra i { display: block; height: 100%; background: var(--accento) }
.fase { display: grid; grid-template-columns: 70px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0 }
.fase .n { font: 12px var(--f-dati); color: var(--tenue); text-align: right; font-variant-numeric: tabular-nums }
.grafico { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 10px; overflow-x: auto }
.grafico svg { display: block; width: 100%; height: auto; min-width: 420px }
.grafico text { fill: var(--tenue); font: 10px var(--f-dati) }
.mappa-wrap { position: relative; overflow: auto; background: #124e89; border: 1px solid var(--linea); border-radius: 6px; max-height: 72vh }
.mappa-wrap .tela { position: relative; transform-origin: 0 0 }
.mappa-wrap img { display: block; image-rendering: pixelated }
.segno { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #181425; cursor: pointer; padding: 0 }
.segno.luogo { background: #fee761 } .segno.villaggio { background: #feae34; border-radius: 2px } .segno.ingresso { background: #8b9bb4; width: 9px; height: 9px; margin: -4px 0 0 -4px }
.segno.bosssotto { background: #e43b44 } .segno.partenza { background: #fff; width: 14px; height: 14px; margin: -7px 0 0 -7px }
.segno.ok { box-shadow: 0 0 0 2px var(--ok) } .segno.no { box-shadow: 0 0 0 2px #e43b44 }
.riquadro { position: absolute; border: 1px dashed rgba(255,255,255,.55); pointer-events: none; font: 11px var(--f-dati); color: #fff; text-shadow: 0 1px 2px #000; padding: 2px 4px }
.legenda { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: var(--tenue) }
.legenda label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer }
.pw { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px }
.pw button { border: 1px solid var(--linea); background: var(--pannello); color: var(--testo); border-radius: 999px; padding: 4px 10px; cursor: pointer; font: 500 12px var(--f-testo); display: inline-flex; gap: 6px; align-items: center }
.pw button[aria-pressed="true"] { border-color: var(--testo); background: var(--testo); color: var(--pannello) }
.pw .pallino { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #181425 }
.seq { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px }
.seq header { position: static; background: none; border: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.seq .num { font: 700 18px var(--f-dati); color: var(--accento) }
.seq .titolo { font: 700 17px var(--f-titolo) }
.abilita { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px }
.ab { border: 1px solid var(--linea); border-radius: 4px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.ab .glifi { display: flex; gap: 4px; flex-wrap: wrap }
.ab .glifi canvas { width: 32px; height: 32px; background: var(--fondo2); border-radius: 3px }
.pannello-dett { position: fixed; z-index: 20; inset: 0; background: rgba(24,20,37,.55); display: flex; justify-content: flex-end }
.pannello-dett[hidden] { display: none !important }
.dett { background: var(--pannello); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 16px; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid var(--linea) }
.dett .chiudi { align-self: flex-end; border: 1px solid var(--linea); background: var(--fondo2); color: var(--testo); border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit }
.dett table { border-collapse: collapse; width: 100%; font-size: 13px }
.dett td { border-top: 1px solid var(--linea); padding: 5px 4px; vertical-align: top }
.dett td:first-child { color: var(--tenue); width: 38%; }
.dett textarea { font: inherit; width: 100%; min-height: 70px; padding: 8px; border: 1px solid var(--linea); border-radius: 4px; background: var(--fondo2); color: var(--testo); resize: vertical }
.controlli { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.controlli select, .controlli button { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--linea); border-radius: 4px; background: var(--fondo2); color: var(--testo); cursor: pointer }
.avviso { background: var(--fondo2); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px; color: var(--tenue) }
.tab-tbl { overflow-x: auto; background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px }
.tab-tbl table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px }
.tab-tbl th, .tab-tbl td { padding: 6px 10px; border-top: 1px solid var(--linea); text-align: left }
.tab-tbl th { color: var(--tenue); font-weight: 600; font-size: 12px; border-top: 0 }
.tab-tbl td.n { font-family: var(--f-dati); text-align: right; font-variant-numeric: tabular-nums }
.vuoto { color: var(--tenue); padding: 20px; text-align: center }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>

<header class="gutter">
  <div class="testata"><h1>Officina di Mirwada</h1><span class="meta" id="meta">caricamento…</span></div>
  <nav id="nav" aria-label="Sezioni"></nav>
</header>
<main class="gutter" id="main"><p class="vuoto">Carico i dati del progetto…</p></main>
<div class="pannello-dett" id="dettaglio" hidden><div class="dett" id="dett" role="dialog" aria-modal="true" aria-label="Dettaglio"></div></div>

<script>
"use strict";
const SEZIONI = [
  ["oggi", "Oggi"], ["avanzamento", "Avanzamento"], ["mondo", "Mondo"], ["paesi", "Paesi e case"],
  ["personaggi", "Personaggi"], ["bestiario", "Bestiario"], ["tecniche", "Tecniche"], ["oggetti", "Oggetti"],
  ["libro", "Libro e HUD"], ["consumo", "Consumo"]];
const DIREZ = ["giù", "su", "sinistra", "destra"];
let D = null;                 // dati.json
const GIU = new Map();        // giudizi: chiave -> {stato, nota, quando}
let CONSUMO = [];             // documenti consumo/*
let db = null, user = null, posso = false, dbStato = "attesa";

// ---------- piccoli aiuti ----------
function h(tag, att, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(att || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of figli.flat()) if (f !== null && f !== undefined && f !== false) e.append(f instanceof Node ? f : document.createTextNode(String(f)));
  return e;
}
const nf = new Intl.NumberFormat("it-IT");
const euro = n => (n === null || n === undefined) ? "—" : "$" + (Math.round(n * 100) / 100).toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const mil = n => (n / 1e6).toLocaleString("it-IT", {maximumFractionDigits: 2}) + " M";
const bello = s => String(s || "").replace(/_/g, " ");
const data = s => s ? new Date(s).toLocaleString("it-IT", {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
function chip(t, cls) { return h("span", {class: "chip" + (cls ? " " + cls : ""), text: t}); }

// ---------- immagini e animazioni ----------
const IMMAGINI = new Map();
function immagine(src) {
  if (!IMMAGINI.has(src)) IMMAGINI.set(src, new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; }));
  return IMMAGINI.get(src);
}
const LETTORI = new Set();
class Lettore {
  constructor(fid, opz = {}) {
    this.f = D.figure[fid]; this.scala = opz.scala || 2; this.dir = opz.dir ?? 0; this.ciclo = opz.ciclo ?? true;
    this.anim = 0; this.frame = 0; this.t = 0; this.giri = 0;
    const maxw = Math.max(...(this.f ? this.f.anims.map(a => a.w) : [64])), maxh = Math.max(...(this.f ? this.f.anims.map(a => a.h) : [64]));
    this.c = h("canvas", {class: "px", width: maxw, height: maxh});
    this.c.style.width = maxw * this.scala + "px";
    if (opz.anim) this.scegli(opz.anim);
    if (this.f) immagine(this.f.file).then(i => { this.img = i; this.disegna(); });
  }
  scegli(nome) { const i = this.f.anims.findIndex(a => a.nome === nome); if (i >= 0) { this.anim = i; this.frame = 0; this.t = 0; this.disegna(); } }
  passo(dt) {
    if (!this.img) return;
    const a = this.f.anims[this.anim]; this.t += dt;
    const dur = a.durate[this.frame] || 120;
    if (this.t < dur) return;
    this.t -= dur; this.frame++;
    if (this.frame >= a.frames) {
      this.frame = 0;
      if (this.ciclo && (!a.loop || ++this.giri > 2)) { this.giri = 0; this.anim = (this.anim + 1) % this.f.anims.length; }
    }
    this.disegna();
  }
  disegna() {
    if (!this.img) return;
    const a = this.f.anims[this.anim], g = this.c.getContext("2d");
    g.imageSmoothingEnabled = false; g.clearRect(0, 0, this.c.width, this.c.height);
    const riga = a.righe > 1 ? this.dir : 0;
    g.drawImage(this.img, this.frame * a.w, a.y + riga * a.h, a.w, a.h, (this.c.width - a.w) / 2, this.c.height - a.h, a.w, a.h);
  }
}
const visibili = new IntersectionObserver(es => { for (const e of es) e.target._lett && (e.isIntersecting ? LETTORI.add(e.target._lett) : LETTORI.delete(e.target._lett)); });
function lettore(fid, opz) {
  if (!D.figure[fid]) return h("div", {class: "sotto", text: "senza figura"});
  const l = new Lettore(fid, opz); l.c._lett = l; visibili.observe(l.c); return l.c;
}
let ultimo = performance.now();
function ciclo(t) { const dt = Math.min(t - ultimo, 200); ultimo = t; for (const l of LETTORI) l.passo(dt); requestAnimationFrame(ciclo); }
requestAnimationFrame(ciclo);

// atlanti e ricolorazione a 4 toni (shaders/rampa_pathway.gdshader)
function daAtlante(nome, id, scala = 1) {
  const a = D.atlanti[nome]; const c = h("canvas", {class: "px", width: a ? a.w : 1, height: a ? a.h : 1});
  if (!a || a.indice[id] === undefined) return c;
  c.style.width = a.w * scala + "px";
  immagine(a.file).then(i => { if (!i) return; const n = a.indice[id], g = c.getContext("2d"); g.imageSmoothingEnabled = false;
    g.drawImage(i, (n % a.cols) * a.w, Math.floor(n / a.cols) * a.h, a.w, a.h, 0, 0, a.w, a.h); });
  return c;
}
function hex(s) { const n = parseInt(String(s || "#888888").slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rampa(pal) {
  const ink = hex(pal.inchiostro || "#181425"), pri = hex(pal.primario || "#8b9bb4"), acc = hex(pal.accento || "#ffffff");
  return [ink, pri.map((v, i) => Math.round(v + (ink[i] - v) * 0.45)), pri, acc];
}
function ricolora(g, w, h_, pal) {
  const r = rampa(pal), px = g.getImageData(0, 0, w, h_), d = px.data;
  for (let i = 0; i < d.length; i += 4) { if (!d[i + 3]) continue; const l = d[i] / 255 * 3, k = l < .5 ? 0 : l < 1.5 ? 1 : l < 2.5 ? 2 : 3; d[i] = r[k][0]; d[i + 1] = r[k][1]; d[i + 2] = r[k][2]; }
  g.putImageData(px, 0, 0);
}
function glifo(prim, pal) {
  const c = daAtlante("primitive", prim); const a = D.atlanti.primitive;
  if (a && a.indice[prim] !== undefined) immagine(a.file).then(() => requestAnimationFrame(() => ricolora(c.getContext("2d"), c.width, c.height, pal)));
  c.title = bello(prim); return c;
}
const EFFETTI = new Set();
function effetto(e, pal, scala = 2) {
  const c = h("canvas", {class: "px"}); let img = null, f = 0, t = 0, w = 0, hh = 0;
  immagine(e.file).then(i => { if (!i) return; img = i; w = i.width / e.frames; hh = i.height; c.width = w; c.height = hh; c.style.width = w * scala + "px"; disegna(); });
  function disegna() { const g = c.getContext("2d"); g.imageSmoothingEnabled = false; g.clearRect(0, 0, w, hh); g.drawImage(img, f * w, 0, w, hh, 0, 0, w, hh); ricolora(g, w, hh, pal); }
  const lett = {passo(dt) { if (!img) return; t += dt; if (t > 90) { t = 0; f = (f + 1) % e.frames; disegna(); } }};
  c._lett = lett; visibili.observe(c); return c;
}

// ---------- giudizi (db) ----------
function statoDi(k) { return (GIU.get(k) || {}).stato || null; }
async function salva(k, campi) {
  if (!db || !posso) return;
  const prima = GIU.get(k) || {};
  const nuovo = {...prima, ...campi, quando: new Date().toISOString()};
  GIU.set(k, nuovo); aggiornaGiudizi();
  try { await db.doc("giudizi/" + k).set(nuovo); } catch (e) { GIU.set(k, prima); aggiornaGiudizi(); avvisoDb("Il giudizio non è stato salvato (" + (e.code || "errore") + ")."); }
}
function avvisoDb(t) { const el = document.getElementById("meta"); if (el) el.textContent = t; }
function bottoniGiudizio(k, piccoli = true) {
  const st = statoDi(k);
