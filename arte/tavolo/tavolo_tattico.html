<title>Tavolo tattico di Mirwada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral+SC:wght@600&display=swap">
<style>
/* Layout: tavolo da cartografo. A sinistra la cassetta degli attrezzi, al centro la mappa viva, a destra il quaderno. */
:root {
  --carta: #eef0f3; --tavolo: #e1e5ec; --pannello: #f7f8fa; --inchiostro: #181425; --grafite: #4a5068;
  --filo: #b8bfcc; --ambra: #a85d06; --ambra-fondo: #fbe7c6; --mare: #10203a; --rischio: #b3262f; --ok: #2c6e49;
  --font-titolo: "Spectral SC", "Iowan Old Style", Georgia, serif;
  --font-testo: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-dati: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --carta: #12111a; --tavolo: #1b1a26; --pannello: #211f2d; --inchiostro: #e9e6f2; --grafite: #a7a3ba;
    --filo: #363449; --ambra: #feae34; --ambra-fondo: #3a2a12; --mare: #070b14; --rischio: #ff6b72; --ok: #6fcf97;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --carta: #12111a; --tavolo: #1b1a26; --pannello: #211f2d; --inchiostro: #e9e6f2; --grafite: #a7a3ba;
  --filo: #363449; --ambra: #feae34; --ambra-fondo: #3a2a12; --mare: #070b14; --rischio: #ff6b72; --ok: #6fcf97;
  color-scheme: dark;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  background: var(--carta); color: var(--inchiostro); font-family: var(--font-testo); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; display: flex; flex-direction: column; gap: 8px;
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
h1 { font-family: var(--font-titolo); font-weight: 600; font-size: 21px; margin: 0; letter-spacing: 0.02em; }
.stato { font-family: var(--font-dati); font-size: 12px; color: var(--grafite); }
.stato.attenzione { color: var(--rischio); } .stato.ok { color: var(--ok); }
.gruppo { display: inline-flex; border: 1px solid var(--filo); border-radius: 6px; overflow: hidden; }
button, select, input, textarea { font: inherit; color: var(--inchiostro); }
.gruppo button { background: var(--tavolo); border: 0; padding: 5px 10px; cursor: pointer; border-right: 1px solid var(--filo); }
.gruppo button:last-child { border-right: 0; }
.gruppo button[aria-pressed="true"] { background: var(--ambra-fondo); box-shadow: inset 0 -2px 0 var(--ambra); }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ambra); outline-offset: 1px; }
.tasto { background: var(--tavolo); border: 1px solid var(--filo); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.tasto:disabled { opacity: 0.45; cursor: default; }
.tasto.pericolo { border-color: var(--rischio); color: var(--rischio); }
.tasto.primario { background: var(--ambra-fondo); border-color: var(--ambra); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 116px minmax(0, 1fr) 340px; gap: 10px; }
/* cassetta degli attrezzi */
nav.attrezzi { display: flex; flex-direction: column; gap: 4px; overflow: auto; }
nav.attrezzi button { display: grid; grid-template-columns: 22px 1fr; align-items: center; gap: 6px; text-align: left; background: var(--tavolo);
  border: 1px solid var(--filo); border-radius: 6px; padding: 6px 7px; cursor: pointer; font-size: 13px; }
nav.attrezzi button[aria-pressed="true"] { background: var(--ambra-fondo); border-color: var(--ambra); font-weight: 600; }
nav.attrezzi button svg { width: 20px; height: 20px; }
nav.attrezzi .tasto-scorciatoia { font-family: var(--font-dati); font-size: 10px; color: var(--grafite); }
nav.attrezzi hr { border: 0; border-top: 1px solid var(--filo); margin: 4px 0; width: 100%; }
/* mappa */
.piano { position: relative; min-width: 0; min-height: 360px; background: var(--mare); border: 1px solid var(--filo); border-radius: 8px; overflow: hidden; }
canvas#tela { display: block; width: 100%; height: 100%; cursor: default; }
canvas#tela.mano { cursor: grab; } canvas#tela.trascina { cursor: grabbing; } canvas#tela.croce { cursor: crosshair; } canvas#tela.nessuno { cursor: none; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--filo); background: var(--tavolo); cursor: pointer; font-family: var(--font-dati); }
.lettura { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--pannello) 92%, transparent); border: 1px solid var(--filo);
  border-radius: 6px; padding: 6px 10px; font-family: var(--font-dati); font-size: 12px; display: flex; gap: 10px; align-items: center; max-width: calc(100% - 60px); flex-wrap: wrap; }
.lettura .campione { width: 14px; height: 14px; border: 1px solid #181425; display: inline-block; vertical-align: -2px; margin-right: 4px; }
.consiglio { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); background: var(--pannello); border: 1px solid var(--ambra);
  border-radius: 6px; padding: 6px 12px; font-size: 13px; max-width: min(560px, calc(100% - 100px)); text-align: center; }
.rigenero { position: absolute; right: 50px; top: 10px; font-family: var(--font-dati); font-size: 12px; background: var(--pannello); border: 1px solid var(--filo); border-radius: 6px; padding: 4px 8px; }
/* quaderno */
aside { min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.schede-tab { display: flex; gap: 0; }
.schede-tab button { flex: 1; background: var(--tavolo); border: 1px solid var(--filo); padding: 6px 4px; cursor: pointer; font-size: 13px; }
.schede-tab button:first-child { border-radius: 6px 0 0 6px; } .schede-tab button:last-child { border-radius: 0 6px 6px 0; }
.schede-tab button + button { border-left: 0; }
.schede-tab button[aria-selected="true"] { background: var(--ambra-fondo); font-weight: 600; box-shadow: inset 0 -2px 0 var(--ambra); }
.contenuto-tab { flex: 1; min-height: 0; overflow: auto; background: var(--pannello); border: 1px solid var(--filo); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
h2 { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grafite); margin: 0; }
h3 { font-family: var(--font-titolo); font-size: 18px; margin: 0; font-weight: 600; word-break: break-word; }
.riga { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px; align-items: center; }
.riga label { color: var(--grafite); font-size: 12px; }
.riga input:not([type="range"]), .riga select, textarea { width: 100%; padding: 4px 6px; border: 1px solid var(--filo); border-radius: 4px; background: var(--carta); font-size: 13px; }
.riga input[type="number"] { font-family: var(--font-dati); }
.cursore { display: grid; grid-template-columns: minmax(0, 1fr) 52px; gap: 6px; align-items: center; }
.cursore output { font-family: var(--font-dati); font-size: 12px; text-align: right; }
textarea { resize: vertical; min-height: 56px; }
.aiuto { font-size: 12px; color: var(--grafite); margin: 0; line-height: 1.45; }
.vuoto { color: var(--grafite); margin: 0; }
.etichetta-mod { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--ambra); border: 1px solid var(--ambra); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
.tavolozza { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.tavolozza button { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border: 1px solid var(--filo); background: var(--carta); border-radius: 4px; cursor: pointer; font-size: 12px; text-align: left; min-width: 0; }
.tavolozza button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tavolozza button[aria-pressed="true"] { border-color: var(--ambra); box-shadow: inset 0 0 0 1px var(--ambra); background: var(--ambra-fondo); }
.sw { width: 16px; height: 16px; flex: 0 0 16px; border: 1px solid #181425; border-radius: 2px; }
.tipi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.tipi button { display: flex; gap: 6px; align-items: center; padding: 6px; border: 1px solid var(--filo); background: var(--carta); border-radius: 4px; cursor: pointer; font-size: 12px; text-align: left; }
.tipi button[aria-pressed="true"] { border-color: var(--ambra); background: var(--ambra-fondo); font-weight: 600; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lista li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 6px 8px; border: 1px solid var(--filo); border-radius: 6px; background: var(--carta); font-size: 13px; }
.lista li .sotto { font-size: 11px; color: var(--grafite); }
.lista li button { font-size: 12px; padding: 3px 8px; }
.contenuti li { grid-template-columns: 118px minmax(0, 1fr) auto; }
.misure { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 10px; font-family: var(--font-dati); font-size: 12px; font-variant-numeric: tabular-nums; }
.misure .num { text-align: right; } .misure .delta { text-align: right; color: var(--ambra); }
.misure .testa { color: var(--grafite); font-family: var(--font-testo); font-size: 11px; }
.conferma { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.azioni { display: flex; flex-wrap: wrap; gap: 6px; }
@media (max-width: 1100px) { main { grid-template-columns: 104px minmax(0, 1fr) 300px; } }
@media (max-width: 860px) {
  html, body { height: auto; }
  main { grid-template-columns: minmax(0, 1fr); }
  nav.attrezzi { flex-direction: row; flex-wrap: wrap; }
  nav.attrezzi hr { display: none; }
  .piano { height: 62svh; }
  aside { min-height: 420px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <h1>Tavolo tattico di Mirwada</h1>
  <div class="gruppo" aria-label="Livello">
    <button id="liv-sopra" aria-pressed="true">Superficie</button>
    <button id="liv-sotto" aria-pressed="false">Sottosuolo</button>
  </div>
  <div class="gruppo" aria-label="Vista">
    <button id="vis-confini" aria-pressed="true">Confini delle zone</button>
    <button id="vis-nomi" aria-pressed="true">Nomi</button>
    <button id="vis-prima" aria-pressed="false" title="Tieni premuto per vedere la mappa generata prima delle tue modifiche">Confronta con l'originale</button>
  </div>
  <div class="azioni">
    <button class="tasto" id="annulla" disabled>Annulla <span class="stato">Ctrl+Z</span></button>
    <button class="tasto" id="rifai" disabled>Rifai</button>
  </div>
  <span class="stato" id="stato" role="status">Carico la mappa…</span>
</header>

<main>
  <nav class="attrezzi" aria-label="Strumenti" id="attrezzi"></nav>

  <div class="piano" id="piano">
    <canvas id="tela" aria-label="Mappa del mondo modificabile"></canvas>
    <div class="consiglio" id="consiglio"></div>
    <div class="rigenero" id="rigenero" hidden>Ridisegno…</div>
    <div class="zoom">
      <button id="z-piu" aria-label="Avvicina">+</button>
      <button id="z-meno" aria-label="Allontana">−</button>
      <button id="z-tutto" aria-label="Mostra tutta la mappa">⤢</button>
    </div>
    <div class="lettura" id="lettura">Passa il mouse sulla mappa per leggere terreno, zona e coordinate.</div>
  </div>

  <aside>
    <div class="schede-tab" role="tablist">
      <button role="tab" id="tab-scheda" aria-selected="true">Scheda</button>
      <button role="tab" id="tab-registro" aria-selected="false">Modifiche <span id="n-mod"></span></button>
      <button role="tab" id="tab-misure" aria-selected="false">Misure</button>
    </div>
    <div class="contenuto-tab" id="pannello"></div>
  </aside>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const crea = (tag, attr = {}, ...figli) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attr)) {
      if (k === "testo") e.textContent = v; else if (k === "classe") e.className = v;
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== undefined && v !== null) e.setAttribute(k, v);
    }
    figli.flat().forEach((f) => f != null && e.append(f));
    return e;
  };
  const metti = (el, ...figli) => el.append(...figli.filter((f) => f != null));   // salta i pezzi facoltativi vuoti
  const clona = (o) => JSON.parse(JSON.stringify(o));
  const leggibile = (s) => String(s || "").replace(/_/g, " ");

  // ---------- nomi dei terreni in italiano (gli id restano quelli del generatore) ----------
  const NOMI_TERRENI = { deep_water: "acqua profonda", water: "acqua bassa", sand: "sabbia", mud: "fango", grass: "erba",
    dry_grass: "erba secca", forest: "bosco", dirt: "terra battuta", path: "sentiero", stone: "pietra (edifici)", snow: "neve" };
  const nomeTerreno = (id) => NOMI_TERRENI[id] || leggibile(id);
  const TIPI = {
    luoghi: { nome: "Luogo speciale", colore: "#e43b44", forma: "quadrato", livello: "sopra" },
    villaggi: { nome: "Villaggio, casa", colore: "#fee761", forma: "cerchio", livello: "sopra" },
    ingressi: { nome: "Ingresso al sottosuolo", colore: "#2ce8f5", forma: "quadrato", livello: "sotto" },
    boss: { nome: "Boss", colore: "#e43b44", forma: "rombo", livello: "sotto" },
  };
  const CONTENUTI = ["abitanti", "negozio", "locanda", "forziere", "nemici", "boss", "missione", "segreto", "risorsa", "altro"];
  const PROFILI = ["frontiera", "vulcanica", "tropicale", "pirati", "relitto", "rovine", "ghiacciata", "mostro", "atollo",
    "boss", "faro", "boschiva", "rocciosa"];
  const BASE_PROFILO = { frontiera: "erba_lilla", relitto: "pietrisco", vulcanica: "cenere", tropicale: "grass", rovine: "dry_grass",
    faro: "arenaria", boss: "forest", pirati: "grass", ghiacciata: "snow", mostro: "muschio_scuro", atollo: "sabbia_bianca",
    boschiva: "forest", rocciosa: "pietrisco" };
  const COLORI_ZONE = { mirwada: "#ead4aa", marche_crepuscolo: "#b86f50", archivio_sepolto: "#c0cbdc", valle_madre: "#63c74d", terra_di_mezzo: "#feae34" };

  // ---------- stato ----------
  let P = null;                 // punti.json (dati fissi del generatore)
  let RU = null;                // mappe di rumore (Float64Array 0..1)
  let lay = null;               // disposizione corrente (= layout_mondo.json)
  let tratti = [];              // pennellate, strade, fiumi, gallerie
  let gen = null, genBase = null;   // risultato del generatore (corrente / con la disposizione originale)
  let livello = "sopra", attrezzo = "seleziona", tab = "scheda";
  let sel = null, vista = { s: 1, ox: 0, oy: 0 };
  let confini = true, nomi = true, mostraPrima = false;
  let addTipo = "luoghi", pennTerreno = "water", pennR = 4, lineaR = 1, tratto = null, mouse = null;
  const img = { sotto: new Image() };
  let tela, ctx, piano, superficieCanvas = null, primaCanvas = null;
  const storia = [], futuro = [];
  let db = null, docRef = null, trattiRef = null, salvaTimer = null, sola = false, inAttesa = 0;
  let trattiSalvati = new Map();

  const stato = (t, tipo) => { const e = $("stato"); e.textContent = t; e.className = "stato" + (tipo ? " " + tipo : ""); };

  // =====================================================================================
  // GENERATORE (stessi passaggi di tools/art/build_world.py, sulle stesse mappe di rumore)
  // =====================================================================================
  function genera(lay, tratti) {
    const { W, H, HC, K, KC } = P, N = W * H;
    const { e, m, d, n1, n2, rq } = RU;
    const L = {}; P.terreni.forEach((t, i) => (L[t] = i));
    const nomiTerra = Object.keys(lay.terra);
    const REG = ["mare", ...nomiTerra, ...lay.isole.map((i) => i.id)];
    const IR = {}; REG.forEach((r, i) => (IR[r] = i));
    const RC = lay.citta.raggio;
    const centroDi = (n) => [Math.trunc(lay.terra[n].x * W), Math.trunc(lay.terra[n].y * HC)];
    const reg = new Int16Array(N), terra = new Uint8Array(N), laguna = new Uint8Array(N);
    const wxA = new Float32Array(N), wyA = new Float32Array(N);
    const px = centroDi("mirwada")[0];
    const zone = nomiTerra.map((n) => [lay.terra[n].x * W, lay.terra[n].y * HC, lay.terra[n].peso ?? 1]);
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
      const costa = HC + (n1[i] - 0.5) * 34 * K + (n2[i] - 0.5) * 10 * K;
      let t = y < costa;
      const gx = (x - px) / (RC * 1.15), gy = (y - HC - 4) / (RC * 0.8);
      if (gx * gx + gy * gy < 1 + (n2[i] - 0.5) * 0.3) t = false;
      terra[i] = t ? 1 : 0;
      const wx = x + (n2[i] - 0.5) * 60 * K, wy = y + (n1[i] - 0.5) * 60 * K;
      wxA[i] = wx; wyA[i] = wy;
      if (t) {
        let best = 0, bd = Infinity;
        for (let z = 0; z < zone.length; z++) { const dd = Math.hypot(wx - zone[z][0], wy - zone[z][1]) * zone[z][2]; if (dd < bd) { bd = dd; best = z; } }
        reg[i] = best + 1;
      }
    }
    lay.isole.forEach((is, k) => {
      const idx = 1 + nomiTerra.length + k, cx = is.x * W, cy = is.y * H, r = is.r;
      const ex = is.profilo === "mostro" ? 1.8 : 1;
      const x0 = Math.max(0, Math.floor(cx - r * 1.2 * ex - 2)), x1 = Math.min(W - 1, Math.ceil(cx + r * 1.2 * ex + 2));
      const y0 = Math.max(0, Math.floor(cy - r * 1.2 / 1.25 - 2)), y1 = Math.min(H - 1, Math.ceil(cy + r * 1.2 / 1.25 + 2));
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const i = y * W + x;
        let dx = x - cx; const dy = (y - cy) * 1.25;
        if (is.profilo === "mostro") dx /= 1.8;
        const rr = Math.hypot(dx, dy);
        let isola = rr < r * (0.8 + 0.4 * n2[i]) && !terra[i];
        if (is.profilo === "atollo") { if (rr < r * 0.62 && !terra[i]) laguna[i] = 1; isola = isola && rr > r * 0.62; }
        if (isola) reg[i] = idx;
      }
    });
    pulisciEnclavi(reg, W, H, Math.trunc(300 * K * K));
    const land = new Uint8Array(N); for (let i = 0; i < N; i++) land[i] = reg[i] > 0 ? 1 : 0;
    const acqua0 = new Uint8Array(N); for (let i = 0; i < N; i++) acqua0[i] = land[i] ? 0 : 1;
    const dmare = bfs(acqua0, W, H, 60), dacqua = bfs(land, W, H, 6);
    const iMW = IR.mirwada, iMC = IR.marche_crepuscolo, iAR = IR.archivio_sepolto, iVL = IR.valle_madre, iTM = IR.terra_di_mezzo;
    const g = new Uint8Array(N).fill(L.grass);
    for (let i = 0; i < N; i++) if (!land[i]) g[i] = dacqua[i] > 4 ? L.deep_water : L.water;
    for (let i = 0; i < N; i++) if (laguna[i] && !land[i]) g[i] = L.water;
    // Mirwada campagna
    for (let i = 0; i < N; i++) if (reg[i] === iMW) { if (d[i] > 0.66) g[i] = L.filari; }
    for (let i = 0; i < N; i++) if (reg[i] === iMW && d[i] < 0.14) g[i] = L.forest;
    // Marche
    const cmw = centroDi("mirwada");
    const alt = new Float32Array(N), grad = new Int16Array(N);
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) {
      const lont = Math.hypot(x - cmw[0], y - cmw[1]);
      alt[i] = 0.35 * e[i] + 0.65 * Math.min(1, Math.max(0, (lont - 40 * K) / (130 * K)));
      grad[i] = Math.floor(alt[i] * 6);
    }
    let sx = 0, sy = 0, cnt = 0;
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++) if (reg[i] === iMC) {
      g[i] = L.pietrisco; sx += x; sy += y; cnt++;
    }
    for (let i = 0; i < N; i++) if (reg[i] === iMC && m[i] > 0.62) g[i] = L.muschio_scuro;
    for (let i = 0; i < N; i++) if (reg[i] === iMC && d[i] < 0.22) g[i] = L.erica_secca;
    const campo = cnt ? [Math.trunc(sx / cnt), Math.trunc(sy / cnt)] : [0, 0];
    for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i++)
