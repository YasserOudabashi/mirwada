<title>Officina di Mirwada</title>

<style>

:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accento: #feae34; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; --velo: rgba(10,8,18,.75); color-scheme: dark } }
:root[data-theme="dark"] {

  --accento: #feae34; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; --velo: rgba(10,8,18,.75); color-scheme: dark }

<header class="alto gutter">
  <div class="testata"><h1>Officina di Mirwada</h1><span class="meta" id="meta">caricamento…</span></div>
  <nav id="nav" aria-label="Sezioni"></nav>

</div></div>

<script>

const SEZIONI = [["oggi", "Oggi"], ["provare", "Da testare"], ["avanzamento", "Avanzamento"], ["mondo", "Mondo"], ["paesi", "Paesi e case"], ["personaggi", "Personaggi"],
  ["bestiario", "Bestiario"], ["tecniche", "Tecniche"], ["oggetti", "Oggetti"], ["libro", "Libro e HUD"], ["consumo", "Consumo"]];
const DIREZ = ["giù", "su", "sinistra", "destra"];
let D = null;
const GIU = new Map();
let CONSUMO = [], db = null, posso = false, dbStato = "attesa";

// ---------- aiuti ----------
function h(tag, att, ...figli) {
  const e = document.createElement(tag);

const nf = new Intl.NumberFormat("it-IT");
const euro = n => (n === null || n === undefined) ? "—" : "$" + Number(n).toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const mil = n => (n / 1e6).toLocaleString("it-IT", {maximumFractionDigits: 2}) + " M";
const bello = s => String(s ?? "").replace(/_/g, " ");
const data = s => s ? new Date(s).toLocaleString("it-IT", {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"}) : "";

function segmento(voci, attiva, scegli) {
  const s = h("div", {class: "seg"}, voci.map(([v, t]) => h("button", {type: "button", "aria-pressed": String(v === attiva), onclick: ev => {
    for (const b of s.children) b.setAttribute("aria-pressed", String(b === ev.currentTarget)); scegli(v); }}, t)));
  return s;

// ---------- immagini, animazioni ----------
const IMMAGINI = new Map();
const immagine = src => { if (!IMMAGINI.has(src)) IMMAGINI.set(src, new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; })); return IMMAGINI.get(src); };

class Lettore {
  constructor(fid, o = {}) {
