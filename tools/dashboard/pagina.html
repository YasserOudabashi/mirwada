<title>Officina di Mirwada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Officina: la pergamena del libro di Mirwada in chiaro, l'inchiostro #181425 di Endesga 32 in scuro.
   Barra in alto con le schede; il dettaglio di ogni cosa si apre grande al centro e si sfoglia con le frecce. */
:root {
  --bg: #eef0f4; --pannello: #ffffff; --fondo2: #e3e7ef; --linea: #c0cbdc; --testo: #262b44; --tenue: #5a6988;
  --accento: #be4a2f; --ok: #3e8948; --no: #e43b44; --attesa: #c26a12; --scacco1: #dfe4ec; --scacco2: #c9d1de; --velo: rgba(24,20,37,.6);
  --f-titolo: "Alegreya SC", Georgia, serif; --f-testo: "Inter", system-ui, sans-serif; --f-dati: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #181425; --pannello: #262b44; --fondo2: #1f1d33; --linea: #3a4466; --testo: #e3e7ef; --tenue: #8b9bb4;
  --accento: #feae34; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; --velo: rgba(10,8,18,.75); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #181425; --pannello: #262b44; --fondo2: #1f1d33; --linea: #3a4466; --testo: #e3e7ef; --tenue: #8b9bb4;
  --accento: #feae34; --ok: #63c74d; --no: #f6757a; --attesa: #feae34; --scacco1: #2c3150; --scacco2: #232741; --velo: rgba(10,8,18,.75); color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--testo); font: 14px/1.45 var(--f-testo); margin: 0 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--pannello) }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header.alto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--pannello); border-bottom: 1px solid var(--linea) }
.testata { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-block: 10px 4px }
.testata h1 { font: 700 22px/1.1 var(--f-titolo); margin: 0; letter-spacing: .02em }
.testata .meta { color: var(--tenue); font: 12px var(--f-dati) }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 4px 0 }
nav a { color: var(--tenue); text-decoration: none; padding: 6px 10px 8px; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500 }
nav a:hover { color: var(--testo) }
nav a[aria-current="page"] { color: var(--testo); border-color: var(--accento) }
main { padding-block: 16px 64px; max-width: 1400px; margin: 0 auto }
h2 { font: 700 20px var(--f-titolo); margin: 0 0 4px; text-wrap: balance }
h3 { font: 600 12px var(--f-testo); text-transform: uppercase; letter-spacing: .07em; color: var(--tenue); margin: 18px 0 8px }
p.intro { color: var(--tenue); margin: 0 0 14px; max-width: 75ch }
.sezione { display: flex; flex-direction: column; gap: 8px }
.scorri { max-height: 68vh; overflow-y: auto; overscroll-behavior: contain; border: 1px solid var(--linea); border-radius: 6px; padding: 10px; background: var(--fondo2) }
.scorri.basso { max-height: 42vh }
.griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px }
.griglia.larga { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)) }
.scheda { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; cursor: pointer; position: relative }
.scheda:hover { border-color: var(--tenue) }
.scheda.st-ok { box-shadow: inset 3px 0 0 var(--ok) } .scheda.st-no { box-shadow: inset 3px 0 0 var(--no) }
:focus-visible { outline: 2px solid var(--accento); outline-offset: 2px }
.nome { font-weight: 600; overflow-wrap: anywhere }
.sotto { color: var(--tenue); font-size: 12px }
.vetrina { background-color: var(--scacco1); background-image: conic-gradient(var(--scacco2) 25%, transparent 0 50%, var(--scacco2) 0 75%, transparent 0); background-size: 16px 16px; border-radius: 4px; display: grid; place-items: center; min-height: 128px; overflow: hidden }
.vetrina.chiaro { --scacco1: #f4f4f4; --scacco2: #dcdcdc } .vetrina.scuro { --scacco1: #181425; --scacco2: #262b44 } .vetrina.erba { --scacco1: #3e8948; --scacco2: #3a8244 }
canvas.px, img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; max-width: none }
img.foto { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; background: var(--fondo2); display: block }
.chips { display: flex; flex-wrap: wrap; gap: 4px }
.chip { font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--fondo2); color: var(--tenue); border: 1px solid var(--linea) }
.chip.ok { color: var(--ok); border-color: var(--ok) } .chip.no { color: var(--no); border-color: var(--no) } .chip.att { color: var(--attesa); border-color: var(--attesa) }
.giudizio { display: flex; gap: 4px }
.giudizio button { flex: 1; white-space: nowrap; border: 1px solid var(--linea); background: var(--fondo2); color: var(--testo); border-radius: 4px; padding: 4px 0; cursor: pointer; font: 600 12px var(--f-testo) }
.giudizio button[aria-pressed="true"].si { background: var(--ok); border-color: var(--ok); color: #fff }
.giudizio button[aria-pressed="true"].no { background: var(--no); border-color: var(--no); color: #fff }
.giudizio button:disabled { opacity: .45; cursor: default }
.nota-card { font-size: 12px; color: var(--no); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.nota-card:empty { display: none }
.filtri { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px }
.filtri input[type=search], .filtri select { font: inherit; padding: 5px 8px; border: 1px solid var(--linea); border-radius: 4px; background: var(--pannello); color: var(--testo); min-width: 0 }
.filtri input[type=search] { flex: 1 1 220px }
.conta { color: var(--tenue); font: 12px var(--f-dati); white-space: nowrap }
.seg { display: inline-flex; border: 1px solid var(--linea); border-radius: 4px; overflow: hidden; flex-wrap: wrap }
.seg button { border: 0; background: var(--pannello); color: var(--tenue); padding: 5px 9px; cursor: pointer; font: 500 12px var(--f-testo) }
.seg button[aria-pressed="true"] { background: var(--testo); color: var(--pannello) }
.btn { font: 500 12px var(--f-testo); padding: 5px 10px; border: 1px solid var(--linea); border-radius: 4px; background: var(--fondo2); color: var(--testo); cursor: pointer }
.btn:hover { border-color: var(--tenue) }
.numeri { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 8px }
.numero { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px }
.numero b { display: block; font: 600 24px var(--f-dati); font-variant-numeric: tabular-nums }
.numero span { color: var(--tenue); font-size: 12px }
.lista { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px }
.lista > div { padding: 8px 12px; border-top: 1px solid var(--linea); display: flex; gap: 10px; align-items: baseline; min-width: 0 }
.lista > div:first-child { border-top: 0 }
.lista > div.cliccabile { cursor: pointer } .lista > div.cliccabile:hover { background: var(--fondo2) }
.lista .id { font: 600 12px var(--f-dati); color: var(--accento); white-space: nowrap }
.lista .tx { min-width: 0; overflow-wrap: anywhere; flex: 1 }
.lista .dx { color: var(--tenue); font: 12px var(--f-dati); white-space: nowrap }
.due { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px }
@media (max-width: 860px) { .due { grid-template-columns: 1fr } }
.barra { height: 8px; background: var(--fondo2); border-radius: 4px; overflow: hidden } .barra i { display: block; height: 100%; background: var(--accento) }
.grafico { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 10px; overflow-x: auto }
.grafico svg { display: block; width: 100%; height: auto; min-width: 420px }
.grafico text { fill: var(--tenue); font: 10px var(--f-dati) }
.mappa-wrap { position: relative; overflow: auto; background: #124e89; border: 1px solid var(--linea); border-radius: 6px; max-height: 72vh }
.mappa-wrap .tela { position: relative; transform-origin: 0 0 }
.mappa-wrap img { display: block; image-rendering: pixelated; max-width: none }
.segno { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid #181425; cursor: pointer; padding: 0 }
.segno.luogo { background: #fee761 } .segno.villaggio { background: #feae34; border-radius: 2px } .segno.ingresso { background: #8b9bb4; width: 9px; height: 9px; margin: -4px 0 0 -4px }
.segno.bosssotto { background: #e43b44 } .segno.partenza { background: #fff; width: 14px; height: 14px; margin: -7px 0 0 -7px }
.segno.ok { box-shadow: 0 0 0 2px #63c74d } .segno.no { box-shadow: 0 0 0 2px #e43b44 }
.riquadro { position: absolute; border: 1px dashed rgba(255,255,255,.55); pointer-events: none; font: 11px var(--f-dati); color: #fff; text-shadow: 0 1px 2px #000; padding: 2px 4px }
.legenda { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: var(--tenue) }
.legenda label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer }
.pw { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px }
.pw button { border: 1px solid var(--linea); background: var(--pannello); color: var(--testo); border-radius: 999px; padding: 4px 10px; cursor: pointer; font: 500 12px var(--f-testo); display: inline-flex; gap: 6px; align-items: center }
.pw button[aria-pressed="true"] { border-color: var(--testo); background: var(--testo); color: var(--pannello) }
.pallino { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid #181425 }
.seq { background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px }
.seq .testa { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.seq .num { font: 700 18px var(--f-dati); color: var(--accento) }
.seq .titolo { font: 700 17px var(--f-titolo) }
.glifi { display: flex; gap: 4px; flex-wrap: wrap }
/* la finestra di dettaglio, al centro */
.modale { position: fixed; z-index: 20; inset: 0; background: var(--velo); display: grid; place-items: center; padding: calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)) }
.modale[hidden] { display: none !important }
.finestra { background: var(--pannello); border: 1px solid var(--linea); border-radius: 8px; width: min(1240px, 100%); height: min(94vh, 100%); display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden }
.barra-alta { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--linea); min-width: 0 }
.barra-alta h2 { margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.corpo { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); min-height: 0 }
.corpo > div { overflow-y: auto; padding: 14px; min-width: 0 }
.corpo .info { border-left: 1px solid var(--linea); display: flex; flex-direction: column; gap: 12px }
@media (max-width: 820px) { .corpo { grid-template-columns: 1fr; overflow-y: auto } .corpo > div { overflow: visible } .corpo .info { border-left: 0; border-top: 1px solid var(--linea) } }
.info textarea { font: inherit; width: 100%; min-height: 84px; padding: 8px; border: 1px solid var(--linea); border-radius: 4px; background: var(--fondo2); color: var(--testo); resize: vertical }
.salvato { font: 11px var(--f-dati); color: var(--tenue); min-height: 14px }
.blocco h4 { margin: 0 0 4px; font: 600 12px var(--f-testo); text-transform: uppercase; letter-spacing: .06em; color: var(--tenue) }
.blocco ul { margin: 0; padding-left: 18px } .blocco li { margin: 2px 0; overflow-wrap: anywhere }
.dati table { border-collapse: collapse; width: 100%; font-size: 13px }
.dati td { border-top: 1px solid var(--linea); padding: 5px 4px; vertical-align: top; overflow-wrap: anywhere }
.dati td:first-child { color: var(--tenue); width: 40% }
.visore { overflow: auto; background: var(--fondo2); border-radius: 6px; max-height: 70vh; display: grid; place-items: center }
.visore img { image-rendering: pixelated; max-width: none; cursor: zoom-in }
.visore.adatta img { max-width: 100%; max-height: 68vh }
.controlli { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 }
.controlli label { font-size: 12px; color: var(--tenue); display: inline-flex; gap: 6px; align-items: center }
.controlli input[type=range] { width: 140px }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px }
.mini button { border: 1px solid var(--linea); background: var(--fondo2); border-radius: 4px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--testo); font: 11px var(--f-testo) }
.mini button[aria-pressed="true"] { border-color: var(--accento); box-shadow: 0 0 0 1px var(--accento) }
.campo { display: block; width: 100%; border-radius: 6px; image-rendering: pixelated; background: #3e8948; outline: none; cursor: pointer }
.campo:focus { box-shadow: 0 0 0 3px var(--accento) }
.tasti { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--tenue) }
.tasti kbd { font: 600 11px var(--f-dati); border: 1px solid var(--linea); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--fondo2); color: var(--testo) }
.sfoglia { display: grid; gap: 8px }
.sfoglia .pagina { background: var(--fondo2); border-radius: 6px; overflow: hidden; cursor: zoom-in }
.sfoglia .pagina img { width: 100%; display: block }
.striscia { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px }
.striscia button { flex: 0 0 140px; border: 2px solid transparent; padding: 0; border-radius: 4px; cursor: pointer; background: none }
.striscia button[aria-current="true"] { border-color: var(--accento) }
.striscia img { width: 100%; display: block; border-radius: 2px }
.tab-tbl { overflow-x: auto; background: var(--pannello); border: 1px solid var(--linea); border-radius: 6px }
.tab-tbl table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px }
.tab-tbl th, .tab-tbl td { padding: 6px 10px; border-top: 1px solid var(--linea); text-align: left; vertical-align: top }
.tab-tbl th { color: var(--tenue); font-weight: 600; font-size: 12px; border-top: 0 }
.tab-tbl td.n { font-family: var(--f-dati); text-align: right; font-variant-numeric: tabular-nums }
.avviso { background: var(--fondo2); border: 1px solid var(--linea); border-radius: 6px; padding: 10px 12px; color: var(--tenue) }
.vuoto { color: var(--tenue); padding: 20px; text-align: center }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important } }
</style>

<header class="alto gutter">
  <div class="testata"><h1>Officina di Mirwada</h1><span class="meta" id="meta">caricamento…</span></div>
  <nav id="nav" aria-label="Sezioni"></nav>
</header>
<main class="gutter" id="main"><p class="vuoto">Carico i dati del progetto…</p></main>
<div class="modale" id="modale" hidden><div class="finestra" role="dialog" aria-modal="true" aria-labelledby="mod-titolo">
  <div class="barra-alta">
    <button class="btn" type="button" id="mod-prima" title="Precedente (← o A)">◀</button>
    <button class="btn" type="button" id="mod-dopo" title="Successivo (→ o D)">▶</button>
    <h2 id="mod-titolo"></h2><span class="conta" id="mod-conta"></span>
    <button class="btn" type="button" id="mod-chiudi" title="Chiudi (Esc)">Chiudi</button>
  </div>
  <div class="corpo"><div id="mod-media"></div><div class="info" id="mod-info"></div></div>
</div></div>

<script>
"use strict";
const SEZIONI = [["oggi", "Oggi"], ["avanzamento", "Avanzamento"], ["mondo", "Mondo"], ["paesi", "Paesi e case"], ["personaggi", "Personaggi"],
  ["bestiario", "Bestiario"], ["tecniche", "Tecniche"], ["oggetti", "Oggetti"], ["libro", "Libro e HUD"], ["consumo", "Consumo"]];
const DIREZ = ["giù", "su", "sinistra", "destra"];
let D = null;
const GIU = new Map();
let CONSUMO = [], db = null, posso = false, dbStato = "attesa";

// ---------- aiuti ----------
function h(tag, att, ...figli) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(att || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const f of figli.flat(Infinity)) if (f !== null && f !== undefined && f !== false) e.append(f instanceof Node ? f : document.createTextNode(String(f)));
  return e;
}
const nf = new Intl.NumberFormat("it-IT");
const euro = n => (n === null || n === undefined) ? "—" : "$" + Number(n).toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const mil = n => (n / 1e6).toLocaleString("it-IT", {maximumFractionDigits: 2}) + " M";
const bello = s => String(s ?? "").replace(/_/g, " ");
const data = s => s ? new Date(s).toLocaleString("it-IT", {day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit"}) : "";
const chip = (t, cls) => h("span", {class: "chip" + (cls ? " " + cls : ""), text: t});
function segmento(voci, attiva, scegli) {
  const s = h("div", {class: "seg"}, voci.map(([v, t]) => h("button", {type: "button", "aria-pressed": String(v === attiva), onclick: ev => {
    for (const b of s.children) b.setAttribute("aria-pressed", String(b === ev.currentTarget)); scegli(v); }}, t)));
  return s;
}

// ---------- immagini, animazioni ----------
const IMMAGINI = new Map();
const immagine = src => { if (!IMMAGINI.has(src)) IMMAGINI.set(src, new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; })); return IMMAGINI.get(src); };
const ATTIVI = new Set();
let ultimo = performance.now();
(function ciclo(t) { const dt = Math.min(t - ultimo, 200); ultimo = t; for (const l of ATTIVI) l.passo(dt); requestAnimationFrame(ciclo); })(performance.now());
const visibili = new IntersectionObserver(es => { for (const e of es) if (e.target._lett) e.isIntersecting ? ATTIVI.add(e.target._lett) : ATTIVI.delete(e.target._lett); });
function guarda(el, lett) { el._lett = lett; visibili.observe(el); return el; }

class Lettore {
  constructor(fid, o = {}) {
    this.f = D.figure[fid]; this.scala = o.scala || 2; this.dir = o.dir ?? 0; this.giro = o.giro ?? true; this.velocita = 1; this.pausa = false;
    this.anim = 0; this.frame = 0; this.t = 0; this.giri = 0; this.alFinire = null;
    const W = Math.max(...this.f.anims.map(a => a.w)), H = Math.max(...this.f.anims.map(a => a.h));
    this.c = h("canvas", {class: "px", width: W, height: H}); this.c.style.width = W * this.scala + "px";
    if (o.anim) this.scegli(o.anim);
    immagine(this.f.file).then(i => { this.img = i; this.disegna(); });
  }
  get a() { return this.f.anims[this.anim]; }
  scegli(nome, alFinire = null) { const i = typeof nome === "number" ? nome : this.f.anims.findIndex(a => a.nome === nome); if (i >= 0) { this.anim = i; this.frame = 0; this.t = 0; this.alFinire = alFinire; this.disegna(); this.cambiato?.(); } }
  ha(nome) { return this.f.anims.some(a => a.nome === nome); }
  ingrandisci(s) { this.scala = s; this.c.style.width = this.c.width * s + "px"; }
  avanza(n) { const a = this.a; this.frame = (this.frame + n + a.frames) % a.frames; this.t = 0; this.disegna(); this.cambiato?.(); }
  passo(dt) {
    if (!this.img || this.pausa) return;
    this.t += dt * this.velocita;
    const dur = this.a.durate[this.frame] || 120;
    if (this.t < dur) return;
    this.t -= dur; this.frame++;
    if (this.frame >= this.a.frames) {
      if (this.alFinire) { const f = this.alFinire; this.alFinire = null; this.frame = this.a.frames - 1; f(); return; }
      this.frame = 0;
      if (this.giro && (!this.a.loop || ++this.giri > 2)) { this.giri = 0; this.anim = (this.anim + 1) % this.f.anims.length; }
    }
    this.disegna(); this.cambiato?.();
  }
  disegna() {
    if (!this.img) return;
    const a = this.a, g = this.c.getContext("2d"); g.imageSmoothingEnabled = false; g.clearRect(0, 0, this.c.width, this.c.height);
    g.drawImage(this.img, this.frame * a.w, a.y + (a.righe > 1 ? this.dir : 0) * a.h, a.w, a.h, (this.c.width - a.w) / 2, this.c.height - a.h, a.w, a.h);
