name: CI

# Validator dei dati + suite headless.
#
# 2026-09-06: i 2000 min/mese di Actions dell'account sono ESAURITI (2199/2000,
# reset 1 ottobre 2026). Fino ad allora i trigger automatici sono DISATTIVATI
# per non generare overage a pagamento: resta solo l'avvio a mano
# (workflow_dispatch). I test si lanciano comunque in locale a ogni story
# (Godot headless, vedi progress.txt / regola ralph), quindi la rete di
# sicurezza non sparisce.
#
# PER RIATTIVARE (dopo il reset o dopo aver messo il budget Actions a $0 su
# github.com/settings/billing) togli il commento a push: e pull_request: qui
# sotto. La config e' gia' magra: solo main, niente commit di sola doc,
# concurrency, timeout, cache del binario Godot.

on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - "**.md"
  #     - "006_PRD/**"
  #     - "docs/**"
  #     - "diario.py"
  #     - "progress.txt"
  #     - "img/**"
  # pull_request:
  #   paths-ignore:
  #     - "**.md"
  #     - "006_PRD/**"
  #     - "docs/**"
  #     - "diario.py"
  #     - "progress.txt"
  #     - "img/**"
  workflow_dispatch:

# Un push nuovo sullo stesso ref annulla la run precedente ancora in coda/corso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valida-e-testa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validator dei dati
        run: python tools/validate_data.py

      - name: Cache del binario Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Scarica Godot ${{ env.GODOT_VERSION }} headless
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          file="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip "${base}/${file}.zip"
          unzip -q godot.zip
          mv "${file}" ~/godot/godot
          chmod +x ~/godot/godot

      - name: Godot sul PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          "$HOME/godot/godot" --version

      - name: Import delle risorse
        # L'import headless in 4.3 non sempre esce 0; il gate vero e' la suite.
        run: timeout 120 godot --headless --path . --import || true

      - name: Suite headless
        run: godot --headless --path . --script res://tests/run_tests.gd
